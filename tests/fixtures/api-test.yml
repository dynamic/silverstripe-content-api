SilverStripe\Security\Group:
  apiGroup:
    Title: 'API Users'
  adminGroup:
    Title: 'Admins'

SilverStripe\Security\Permission:
  apiAccess:
    Code: CONTENT_API_ACCESS
    Group: =>SilverStripe\Security\Group.apiGroup
  adminPerm:
    Code: ADMIN
    Group: =>SilverStripe\Security\Group.adminGroup
  populatePerm:
    Code: CONTENT_API_POPULATE
    Group: =>SilverStripe\Security\Group.adminGroup

SilverStripe\Security\Member:
  apiUser:
    FirstName: Agent
    Surname: Account
    Email: agent@example.com
    Groups: =>SilverStripe\Security\Group.apiGroup
